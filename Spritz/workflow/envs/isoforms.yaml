# isoforms.yaml: partial environment for isoform reconstruction
channels:
  - conda-forge
  - bioconda
dependencies:
  - python =3.13
  - samtools =1.24 # see align.yaml
  - stringtie
  - gzip # use conda's gzip, not the system's
  - picard # for ProteomeGenerator
  - transdecoder =5.7.1=pl5321hdfd78af_1 # for ProteomeGenerator; later builds drop the scripts from bin/
  - perl ==5.32.1=7_* # transdecoder ships *.pl; build 8 breaks @INC — conda-forge/perl-feedstock#79
  - gffread # for ProteomeGenerator
  - blast # for ProteomeGenerdator
