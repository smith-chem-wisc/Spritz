# align.yaml: partial environment for alignment
channels:
  - conda-forge
  - bioconda
dependencies:
  - python =3.13
  - hisat2 =2.2.1
  - perl ==5.32.1=7_* # bin/hisat2 is a perl script; build 8 breaks @INC — conda-forge/perl-feedstock#79
  - samtools =1.24 # 1.11 pins zlib <1.3 and an old ncurses; will not solve past python 3.10
  - fastp
