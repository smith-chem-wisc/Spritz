name: Releases

on:
  push:
    tags:
    - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  githubrelease:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify commit exists in release branch
        run: |
          git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
          git branch --remote --contains | grep origin/${env:RELEASE_BRANCH}
        env:
          RELEASE_BRANCH: master

      - name: Restore dependencies
        run: dotnet restore Spritz/Spritz.sln

      - name: Build
        run: |
          $version= &git describe --tags
          dotnet build --no-restore --configuration Release /p:Version=${version} /p:Platform=x64 Spritz/Spritz.sln

      - name: Test
        run: |
          $version= &git describe --tags
          dotnet test --configuration Release /p:Platform=x64 /p:Version=${version} --no-build Spritz/Spritz.sln

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Installer
        run: |
          $version= &git describe --tags
          msbuild Spritz/SpritzInstaller/SpritzInstaller.wixproj  /p:Configuration=Release /p:Version=${version}

      - name: Create archive
        uses: thedoctor0/zip-release@0.7.6
        with:
          type: 'zip'
          filename: 'SpritzCMD.zip'
          path: Spritz/SpritzCMD/bin/x64/Release/net10.0/
          directory: ./

      - name: Upload SpritzCMD
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: SpritzCMD.zip
          tag: ${{ github.ref }}

      - name: Upload Installer
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Spritz/SpritzInstaller/bin/Release/Spritz.msi
          tag: ${{ github.ref }}


  # Self-contained desktop builds of the Avalonia GUI, added alongside the Windows installer rather
  # than replacing it. Published per runner so each platform's binaries are produced natively: the
  # macOS .app bundle in particular needs the executable bit and bundle layout that a native runner
  # gives, and ditto rather than zip to preserve them.
  #
  # These are a preview. The WPF installer above remains the supported Windows download.
  desktop:
    name: Desktop GUI (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64,   archive: zip }
          - { os: ubuntu-latest,  rid: linux-x64, archive: targz }
          - { os: macos-latest,   rid: osx-arm64, archive: app }
          - { os: macos-latest,   rid: osx-x64,   archive: app }
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    # Same tag-driven version as everything else, so the GUI reports what the release says.
    - name: Publish
      shell: bash
      run: |
        version=$(git describe --tags)
        dotnet publish Spritz/SpritzGUI.Avalonia/SpritzGUI.Avalonia.csproj \
          --configuration Release --runtime ${{ matrix.rid }} --self-contained true \
          /p:Version=${version} --output publish/${{ matrix.rid }}

    - name: Assemble macOS .app bundle
      if: matrix.archive == 'app'
      shell: bash
      run: |
        version=$(git describe --tags)
        app="Spritz.app"
        mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
        cp -R publish/${{ matrix.rid }}/. "$app/Contents/MacOS/"
        chmod +x "$app/Contents/MacOS/Spritz"
        cat > "$app/Contents/Info.plist" <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleName</key><string>Spritz</string>
          <key>CFBundleDisplayName</key><string>Spritz</string>
          <key>CFBundleIdentifier</key><string>edu.wisc.smithchem.spritz</string>
          <key>CFBundleExecutable</key><string>Spritz</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>${version}</string>
          <key>CFBundleVersion</key><string>${version}</string>
          <key>LSMinimumSystemVersion</key><string>11.0</string>
          <key>NSHighResolutionCapable</key><true/>
        </dict>
        </plist>
        PLIST
        # ditto, not zip: it preserves the bundle's structure and permissions.
        ditto -c -k --keepParent "$app" "Spritz-${{ matrix.rid }}.app.zip"

    - name: Archive (zip)
      if: matrix.archive == 'zip'
      shell: bash
      run: cd publish/${{ matrix.rid }} && 7z a ../../Spritz-${{ matrix.rid }}.zip .

    - name: Archive (tar.gz)
      if: matrix.archive == 'targz'
      shell: bash
      run: tar -czf Spritz-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

    - name: Upload
      uses: svenstaro/upload-release-action@2.11.5
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: Spritz-${{ matrix.rid }}.*
        file_glob: true
        tag: ${{ github.ref }}

  dockerrelease:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Spritz/SpritzCMD/SpritzCMD.csproj

    # /p:Version matters here, not just in the githubrelease job: RunnerEngine.CurrentVersion is read
    # from the assembly, and it is written into the config the container consumes. Without this the
    # published image would report the development default while being tagged with the release version.
    - name: Build SpritzCMD
      run: |
        version=$(git describe --tags)
        dotnet build --no-restore --configuration Release /p:Version=${version} Spritz/SpritzCMD/SpritzCMD.csproj

    - name: Build docker image
      run: docker build -t spritz ./Spritz/

    - name: Run quick test, reference database
      run: docker run --user=root spritz conda run --no-capture-output --live-stream dotnet SpritzCMD.dll -a=/app/spritz/results/ -r="release-96,saccharomyces_cerevisiae,baker's yeast,R64-1-1"

    - name: Login, tag, and push
      run: |
        echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
        version=$(git describe --tags)
        docker tag spritz ${{ secrets.DOCKERHUB_USERNAME }}/spritz:$version
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/spritz:$version
