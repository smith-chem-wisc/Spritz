name: Builds and tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Deliberately not on the hour. GitHub warns that scheduled runs are delayed - and can be dropped -
    # during the load spike at the top of every hour, which is exactly when this used to be queued.
    - cron: '37 4 * * 1-5'
  # Lets a maintainer re-run the whole thing from the Actions tab without pushing a commit. Useful for
  # checking whether an external break has cleared, and for waking the schedule up after GitHub has
  # disabled it for repository inactivity.
  workflow_dispatch:

jobs:
  builds:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Spritz/Spritz.sln

    - name: Build .NET
      run: dotnet build --no-restore --configuration Release /p:Platform=x64 Spritz/Spritz.sln

    # Excludes tests that reach third-party services, so a UniProt or GitHub API outage cannot redden a
    # pull request that did not break anything. Those tests still run, in the non-blocking job below.
    - name: Test .NET
      run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category!=ExternalService" Spritz/Spritz.sln

    - name: Setup msbuild
      uses: microsoft/setup-msbuild@v3

    - name: Build Installer
      run: msbuild Spritz/SpritzInstaller/SpritzInstaller.wixproj /p:Configuration=Release

  # Lints and plans the workflow without running it. This is deliberately cheap and independent of
  # the container: no genomic data is downloaded and no conda envs beyond the base one are created,
  # so it gives a fast signal on rule-graph breakage - the class of failure reported in issue #243,
  # "MissingInputException in rule all" - long before the 90-minute dockerbuild job would surface it.
  #
  # It installs the pinned base environment rather than a snakemake of its own, so the snakemake
  # version linting the workflow is the same one that runs it, and so this job also acts as a fast
  # check that spritzbase.yaml still solves.
  workflow:
    name: Lint and dry-run the workflow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7

    - name: Set up the pinned Spritz base environment
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: Spritz/workflow/envs/spritzbase.yaml
        environment-name: spritzbase
        cache-environment: true

    - name: Lint the workflow
      shell: bash -el {0}
      run: cd Spritz/workflow && snakemake --lint

    # Each analysis combination takes a different branch of all_output in common.smk, which is the
    # function that raised the MissingInputException in #243, so all of them are planned rather than
    # just the one the checked-in config happens to select.
    #
    # Written as one step per combination rather than a shell loop that aggregates exit codes. The loop
    # form reported failure in CI while every dry-run inside it printed success and no error was echoed,
    # and it could not be reproduced locally against the same snakemake version, the same environment
    # built from spritzbase.yaml, or under bash -e. Separate steps let the runner report which command
    # failed instead of relying on shell bookkeeping to do it.
    - name: Dry-run - quant
      shell: bash -el {0}
      run: cd Spritz/workflow && snakemake --dry-run --cores 1 --config "analyses=[quant]"

    - name: Dry-run - variant
      shell: bash -el {0}
      run: cd Spritz/workflow && snakemake --dry-run --cores 1 --config "analyses=[variant]"

    - name: Dry-run - isoform
      shell: bash -el {0}
      run: cd Spritz/workflow && snakemake --dry-run --cores 1 --config "analyses=[isoform]"

    - name: Dry-run - variant, isoform and quant together
      shell: bash -el {0}
      run: cd Spritz/workflow && snakemake --dry-run --cores 1 --config "analyses=[variant,isoform,quant]"

  # Runs the tests that depend on third-party services: the GitHub releases API, and the UniProt ptmlist
  # and PSI-MOD downloads that mzLib performs when those files are absent. Intentionally NOT a required
  # check, so an upstream outage never blocks a PR, while a genuine break is still visible here.
  # Do NOT add this job to branch-protection required checks.
  external-service-tests:
    name: External-service tests (non-blocking)
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Spritz/Spritz.sln

    - name: Build .NET
      run: dotnet build --no-restore --configuration Release /p:Platform=x64 Spritz/Spritz.sln

    - name: Test .NET (external services)
      run: dotnet test --no-build --configuration Release --verbosity normal --filter "Category=ExternalService" Spritz/Spritz.sln

  # Unit tests for the Python scripts in workflow/scripts. These carry the pipeline's data
  # transformations - chromosome renaming, karyotypic sorting, VCF and GFF3 filtering - and had no
  # coverage at all, so a change in behaviour would only have surfaced as odd output much later.
  # Fast and offline: no genomic data, no containers, no network.
  script-tests:
    name: Workflow script tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Set up the test environment
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-file: Spritz/workflow/envs/tests.yaml
        environment-name: spritz-tests
        cache-environment: true

    - name: Run pytest
      shell: bash -el {0}
      run: cd Spritz/workflow/tests && python -m pytest -v


  dockerbuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore Spritz/SpritzCMD/SpritzCMD.csproj

    - name: Build SpritzCMD
      run: dotnet build --no-restore --configuration Release Spritz/SpritzCMD/SpritzCMD.csproj

    - name: Build docker image
      run: docker build -t spritz ./Spritz/

    - name: Run test in docker image
      run: docker run --user=root spritz conda run --no-capture-output --live-stream dotnet SpritzCMD.dll -bd -a=/app/spritz/results/ -r="release-96,saccharomyces_cerevisiae,baker's yeast,R64-1-1" -s=SRR13737862
