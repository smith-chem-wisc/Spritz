name: Refresh genomes.csv from Ensembl

# Ensembl publishes roughly four releases a year, so this checks monthly and opens a pull
# request only when the generated file actually changes. Nobody has to notice a release.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate and open a PR if it changed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate genomes.csv
        run: python Spritz/workflow/scripts/update_genomes.py

      - name: Check the result is usable
        run: cd Spritz/workflow/tests && python -m pytest test_update_genomes.py -v

      - name: Open a pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-genomes-csv
          delete-branch: true
          title: "Refresh genomes.csv from Ensembl"
          commit-message: "Refresh genomes.csv from Ensembl"
          body: |
            Generated by `workflow/scripts/update_genomes.py`. Ensembl has published at least
            one release since this file was last refreshed.

            The generator reads assembly names from the FTP directory listings rather than
            from `species_EnsemblVertebrates.txt`, because the summary disagrees with the
            real filenames for some species. Species whose gene set version differs from the
            Ensembl release are left out, since Spritz would build a GFF3 URL that 404s.

            Existing rows are preserved, so saved reference strings keep working.
