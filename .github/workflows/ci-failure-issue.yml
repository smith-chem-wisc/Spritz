name: Open an issue when the scheduled build fails

# A red tick on a scheduled run is easy to miss - this repository once went eight months without CI
# running at all - so a failure with nobody watching becomes an issue instead. At most one is open at
# a time.
#
# Keyed on workflow_run rather than a job with `needs:` inside "Builds and tests", so it does not have
# to be kept in step with that workflow's job list.
on:
  workflow_run:
    workflows: ["Builds and tests"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  open-issue:
    name: File an issue for the failure
    # Scheduled runs only. A pull request failure is in front of its author, and a post-merge failure is
    # in front of whoever merged; the scheduled run is the one with nobody watching, which is the gap
    # this exists to close. Keeping the trigger narrow keeps the notification quiet.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const marker = 'CI is failing on master';
            const run = context.payload.workflow_run;

            // Only ever one open issue at a time, so a daily schedule cannot produce a daily issue.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(i => !i.pull_request && i.title.startsWith(marker));
            if (existing) {
              core.info(`Already tracked in #${existing.number}; not opening another.`);
              core.summary.addRaw(`CI failure already tracked in #${existing.number}.`);
              await core.summary.write();
              return;
            }

            const body = [
              `🤖 The scheduled *${run.name}* run failed: ${run.html_url}`,
              '',
              `Commit ${run.head_sha.slice(0, 7)}. Only one of these is open at a time. Close it when CI is green.`,
            ].join('\n');

            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${marker} (${run.event} run #${run.run_number})`,
              body,
            });
            core.info(`Opened #${created.data.number}`);
            core.summary.addRaw(`Opened #${created.data.number} for this failure.`);
            await core.summary.write();
